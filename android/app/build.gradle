plugins {
    id "com.android.application"
}

android {
    namespace "com.olivierh.timebandits"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.olivierh.timebandits"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        debug {
            storeFile file("../../.cache/android/debug.keystore")
            storeType "PKCS12"
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files("libs/timebandits.aar")
}
